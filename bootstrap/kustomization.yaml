apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - application.yaml
configMapGenerator:
  - name: platform-configuration-bootstrap-settings
    namespace: openshift-gitops
    literals:
      - PLATFORM_CONFIGURATION_REPO_URL=https://github.com/contract-first-idp-test/platform-components.git
      - PLATFORM_CONFIGURATION_REVISION=main
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: platform-configuration-bootstrap-settings
      fieldPath: data.PLATFORM_CONFIGURATION_REPO_URL
    targets:
      - select: {kind: Application, name: platform-configuration}
        fieldPaths: [spec.source.repoURL]
  - source:
      kind: ConfigMap
      name: platform-configuration-bootstrap-settings
      fieldPath: data.PLATFORM_CONFIGURATION_REVISION
    targets:
      - select: {kind: Application, name: platform-configuration}
        fieldPaths: [spec.source.targetRevision]
