apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  rbac:
    policy: |
      g, gitops-admins, role:admin
    scopes: '[groups]'
  applicationSet:
    extraCommandArgs:
      - --enable-policy-override
  kustomizeBuildOptions: --load-restrictor LoadRestrictionsNone
