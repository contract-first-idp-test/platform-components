apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-configuration
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  source:
    repoURL: REPLACED_BY_BOOTSTRAP_KUSTOMIZATION
    targetRevision: REPLACED_BY_BOOTSTRAP_KUSTOMIZATION
    path: configuration
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
