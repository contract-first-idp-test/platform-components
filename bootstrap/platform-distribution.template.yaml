apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  source:
    repoURL: "@@PLATFORM_DISTRIBUTION_REPO_URL@@"
    targetRevision: "@@PLATFORM_DISTRIBUTION_REVISION@@"
    path: bootstrap/root
    kustomize:
      patches:
        - target:
            kind: ConfigMap
            name: platform-distribution-settings
          patch: |-
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: platform-distribution-settings
            data:
              PLATFORM_DISTRIBUTION_REPO_URL: "@@PLATFORM_DISTRIBUTION_REPO_URL@@"
              PLATFORM_CONFIGURATION_REPO_URL: "@@PLATFORM_REPO_URL@@"
              PLATFORM_CONFIGURATION_REVISION: "@@PLATFORM_CONFIGURATION_REVISION@@"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
