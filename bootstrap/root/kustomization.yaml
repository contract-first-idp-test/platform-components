apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - application.yaml
  - projects.yaml
  - platform-applicationset.yaml
configMapGenerator:
  - name: platform-bootstrap-settings
    namespace: openshift-gitops
    literals:
      - PLATFORM_REPO_URL=https://github.com/contract-first-idp-test/platform-components.git
      - PLATFORM_REVISION=v1.1.0
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: platform-bootstrap-settings
      fieldPath: data.PLATFORM_REPO_URL
    targets:
      - select: {kind: Application, name: platform-root}
        fieldPaths: [spec.source.repoURL]
      - select: {kind: ApplicationSet, name: platform-applications}
        fieldPaths: [spec.generators.0.matrix.generators.0.git.repoURL]
      - select: {kind: AppProject, name: platform}
        fieldPaths: [spec.sourceRepos.0]
      - select: {kind: AppProject, name: platform-infrastructure}
        fieldPaths: [spec.sourceRepos.0]
      - select: {kind: AppProject, name: platform-operators}
        fieldPaths: [spec.sourceRepos.0]
      - select: {kind: AppProject, name: platform-services}
        fieldPaths: [spec.sourceRepos.0]
      - select: {kind: AppProject, name: tenant-admissions}
        fieldPaths: [spec.sourceRepos.0]
  - source:
      kind: ConfigMap
      name: platform-bootstrap-settings
      fieldPath: data.PLATFORM_REVISION
    targets:
      - select: {kind: Application, name: platform-root}
        fieldPaths: [spec.source.targetRevision]
      - select: {kind: ApplicationSet, name: platform-applications}
        fieldPaths: [spec.generators.0.matrix.generators.0.git.revision]
