apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-applications
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - git:
              repoURL: REPLACED_BY_ROOT_KUSTOMIZATION
              revision: REPLACED_BY_ROOT_KUSTOMIZATION
              pathParamPrefix: target
              files:
                - path: configuration/catalog-info.yaml
          - list:
              elements:
                # Required foundation. Both entries are required for the approved ESO secret flow.
                - {name: operator-external-secrets, project: platform-operators, namespace: external-secrets-operator, path: operators/external-secrets}
                - {name: external-secrets, project: platform-infrastructure, namespace: cf-idp-secrets, path: components/external-secrets}

                # Default workshop infrastructure. Remove an operator only when the target already provides it.
                - {name: operator-postgresql, project: platform-operators, namespace: openshift-operators, path: operators/postgresql}
                - {name: operator-developer-hub, project: platform-operators, namespace: openshift-operators, path: operators/developer-hub}
                - {name: operator-devspaces, project: platform-operators, namespace: openshift-operators, path: operators/devspaces}
                - {name: operator-pipelines, project: platform-operators, namespace: openshift-operators, path: operators/openshift-pipelines}
                - {name: operator-apicurio, project: platform-operators, namespace: openshift-operators, path: operators/apicurio-registry}
                - {name: operator-keycloak, project: platform-operators, namespace: cf-idp-keycloak, path: operators/keycloak}
                - {name: operator-quay, project: platform-operators, namespace: openshift-operators, path: operators/quay}
                - {name: operator-quay-bridge, project: platform-operators, namespace: openshift-operators, path: operators/quay-bridge}
                - {name: operator-hawtio, project: platform-operators, namespace: openshift-operators, path: operators/hawtio}

                # Identity. CF-IDP isolates its upstream Keycloak operator from workshop identity.
                - {name: keycloak, project: platform-services, namespace: cf-idp-keycloak, path: components/keycloak}

                # Registry and delivery. Quay Bridge depends on Quay and both corresponding operators.
                - {name: quay, project: platform-services, namespace: quay, path: components/quay}
                - {name: quay-bridge, project: platform-services, namespace: openshift-operators, path: components/quay-bridge}
                - {name: pipelines, project: platform-services, namespace: tekton-tasks, path: components/pipelines}
                - {name: devspaces, project: platform-services, namespace: openshift-devspaces, path: components/devspaces}

                # API lifecycle. Apicurio and Microcks depend on Keycloak; Apicurio also needs PostgreSQL.
                - {name: apicurio, project: platform-services, namespace: apicurio, path: components/apicurio}
                - {name: microcks, project: platform-services, namespace: microcks, path: components/microcks}
                - {name: hawtio, project: platform-services, namespace: hawtio, path: components/hawtio}

                # Developer portal. Developer Hub consumes identity, registry, API, and delivery services.
                - {name: developer-hub, project: platform-services, namespace: developer-hub, path: components/developer-hub}

                # Tenant support. Admission manifests reference the shared platform services.
                - {name: tenant-admissions, project: tenant-admissions, namespace: openshift-gitops, path: tenants, renderer: directory, source: configuration}
  template:
    metadata:
      name: '{{ .name }}'
      namespace: openshift-gitops
      annotations:
        platform.contract-first.io/cluster-api-url: '{{ .spec.platform.cluster.apiUrl }}'
        platform.contract-first.io/schema-registry-api: '{{ .spec.platform.schemaRegistry.apiUrl }}'
    spec:
      project: '{{ .project }}'
      destination:
        server: '{{ .spec.platform.argocd.destinationServer }}'
        namespace: '{{ .namespace }}'
      source:
        repoURL: '{{ .spec.platform.distribution.repositoryUrl }}'
        targetRevision: '{{ .spec.platform.distribution.revision }}'
        path: '{{ .path }}'
        kustomize:
          commonAnnotations:
            platform.contract-first.io/router-domain: '{{ .spec.platform.cluster.routerDomain }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
  templatePatch: |
    spec:
      {{- if or (eq (get . "source" | default "distribution") "configuration") (eq (get . "renderer" | default "kustomize") "directory") }}
      source:
      {{- if eq (get . "source" | default "distribution") "configuration" }}
        repoURL: '{{ .spec.platform.configuration.repositoryUrl }}'
        targetRevision: '{{ .spec.platform.configuration.revision }}'
      {{- end }}
      {{- if eq (get . "renderer" | default "kustomize") "directory" }}
        kustomize: null
        directory:
          recurse: true
          exclude: '*/admission.yaml'
      {{- end }}
      {{- end }}
      syncPolicy:
        syncOptions:
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
          - SkipDryRunOnMissingResource=true
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
