apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: workshop
  title: Contract-First IDP Workshop Target
  description: Public repository and cluster contract for this platform target.
  annotations:
    github.com/project-slug: contract-first-idp-test/platform-components
spec:
  owner: group:default/platform-engineering
  type: contract-first-idp-target
  platform:
    distribution:
      version: v1.0.0
    configuration:
      host: github.com
      organization: contract-first-idp-test
      repository: platform-components
      repositoryUrl: https://github.com/contract-first-idp-test/platform-components.git
      revision: main
      valuesPath: catalog-info.yaml
    tenantAdmission:
      branch: main
      path: tenants
    target:
      name: workshop
    cluster:
      name: development-cluster
      apiUrl: https://api.example.cluster.com:6443
      routerDomain: apps.example.cluster.com
    argocd:
      namespace: openshift-gitops
      destinationServer: https://kubernetes.default.svc
    dependencies:
      softwareTemplates:
        repositoryUrl: https://github.com/contract-first-idp-test/software-templates.git
        revision: v1.0.0
        catalogPath: catalog-info.yaml
      developerCharts:
        repositoryUrl: https://github.com/contract-first-idp-test/developer-charts.git
        revision: v1.0.0
    charts:
      repositoryUrl: https://github.com/contract-first-idp-test/developer-charts.git
      revision: v1.0.0
    schemaRegistry:
      apiUrl: https://apicurio.apps.example.cluster.com/apis/registry/v3
      uiUrl: https://apicurio-ui.apps.example.cluster.com
    spectralRules:
      repositoryUrl: https://github.com/contract-first-idp/spectral-rules.git
      revision: f2a1e6ab9f428eb822c232d8f460ff1e00199113
      path: ruleset.yaml
    registry:
      quay:
        host: registry-quay-quay.apps.example.cluster.com
        url: https://registry-quay-quay.apps.example.cluster.com
        clusterId: openshift
        credentials:
          sourcePullSecretName: default-quay-openshift
          destinationPushSecretName: builder-quay-openshift
          runtimePullSecretName: default-quay-openshift
    services:
      developerHub:
        url: https://backstage-backstage-developer-hub.apps.example.cluster.com
        oidcCallbackUrl: https://backstage-backstage-developer-hub.apps.example.cluster.com/api/auth/oidc/handler/frame
      keycloak:
        url: https://cf-idp-keycloak-keycloak.apps.example.cluster.com
        privateUrl: https://cf-idp-keycloak.keycloak.svc:8443
      microcks:
        url: https://microcks.apps.example.cluster.com
        redirectUri: https://microcks.apps.example.cluster.com/*
      hawtio:
        host: hawtio.apps.example.cluster.com
      gitea:
        rootUrl: https://gitea-gitea.apps.example.cluster.com/
        domain: gitea-gitea.apps.example.cluster.com
        sshDomain: gitea-ssh.apps.example.cluster.com
    build:
      sourceRevision: main
      sccClusterRoleName: system:openshift:scc:pipelines-scc
      deploymentUpdate:
        strategy: restart
