apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Bootstrap-only profile: GitOps projects plus the External Secrets abstraction seam.
resources:
  - ../../configuration
  - ../../argocd/projects
  - ../../argocd/operator-applications/external-secrets.yaml
  - ../../argocd/applications/external-secrets.yaml
  - ../../argocd/applications/tenant-admissions.yaml
configMapGenerator:
  - name: platform-settings
    envs:
      - ../../config/platform.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: platform-settings
      fieldPath: data.PLATFORM_REPO_URL
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: AppProject
          name: platform-operators
        fieldPaths:
          - spec.sourceRepos.0
      - select:
          kind: AppProject
          name: platform-infrastructure
        fieldPaths:
          - spec.sourceRepos.0
      - select:
          kind: AppProject
          name: platform-services
        fieldPaths:
          - spec.sourceRepos.0
  - source:
      kind: ConfigMap
      name: platform-settings
      fieldPath: data.PLATFORM_CONFIG_REVISION
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.source.targetRevision
