apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Workshop profile: adopts the existing cert-manager and RHBK operators by omitting their Subscriptions.
resources:
  - ../../configuration
  - ../../argocd/projects
  - ../../argocd/operator-applications/external-secrets.yaml
  - ../../argocd/operator-applications/postgresql.yaml
  - ../../argocd/operator-applications/developer-hub.yaml
  - ../../argocd/operator-applications/devspaces.yaml
  - ../../argocd/operator-applications/pipelines.yaml
  - ../../argocd/operator-applications/apicurio.yaml
  - ../../argocd/operator-applications/quay.yaml
  - ../../argocd/operator-applications/quay-bridge.yaml
  - ../../argocd/operator-applications/hawtio.yaml
  - ../../argocd/applications/external-secrets.yaml
  - ../../argocd/applications/keycloak.yaml
  - ../../argocd/applications/quay.yaml
  - ../../argocd/applications/quay-bridge.yaml
  - ../../argocd/applications/apicurio.yaml
  - ../../argocd/applications/microcks.yaml
  - ../../argocd/applications/hawtio.yaml
  - ../../argocd/applications/pipelines.yaml
  - ../../argocd/applications/devspaces.yaml
  - ../../argocd/applications/developer-hub.yaml
  - ../../argocd/applications/tenant-admissions.yaml
configMapGenerator:
  - name: platform-settings
    envs:
      - ../../config/platform.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: platform-settings
      fieldPath: data.PLATFORM_REPO_URL
    targets:
      - select:
          kind: Application
        reject:
          - name: microcks
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: Application
          name: microcks
        fieldPaths:
          - spec.sources.1.repoURL
      - select:
          kind: AppProject
          name: platform-operators
        fieldPaths:
          - spec.sourceRepos.0
      - select:
          kind: AppProject
          name: platform-infrastructure
        fieldPaths:
          - spec.sourceRepos.0
      - select:
          kind: AppProject
          name: platform-services
        fieldPaths:
          - spec.sourceRepos.0
  - source:
      kind: ConfigMap
      name: platform-settings
      fieldPath: data.PLATFORM_CONFIG_REVISION
    targets:
      - select:
          kind: Application
        reject:
          - name: microcks
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: Application
          name: microcks
        fieldPaths:
          - spec.sources.1.targetRevision
