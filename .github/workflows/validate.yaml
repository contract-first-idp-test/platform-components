name: Deterministic tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: '4.21'
      - run: npm ci
      - run: npm test
      - run: git diff --check
