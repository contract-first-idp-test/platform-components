apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: workshop
  title: Contract-First IDP Workshop Target
  description: Public repository and cluster contract for this platform target.
  annotations:
    github.com/project-slug: "fixture-org/platform-components"
spec:
  owner: group:default/platform-maintainers
  type: contract-first-idp-target
  platform:
    distribution:
      repositoryUrl: https://github.com/fixture-org/platform-components.git
      version: 1.1.2
      revision: v1.1.2
    configuration:
      host: "github.com"
      organization: "fixture-org"
      repository: "platform-components"
      repositoryUrl: "https://github.com/fixture-org/platform-components.git"
      revision: "test"
      valuesPath: configuration/catalog-info.yaml
    tenantAdmission:
      branch: "test"
      path: tenants
    target:
      name: workshop
    cluster:
      name: "fixture"
      apiUrl: "https://api.fixture.example:6443"
      routerDomain: "apps.fixture.example"
    argocd:
      namespace: openshift-gitops
      destinationServer: https://kubernetes.default.svc
      webhooks:
        application: "https://openshift-gitops-server-openshift-gitops.apps.fixture.example/api/webhook"
        applicationSet: "https://openshift-gitops-applicationset-controller-openshift-gitops.apps.fixture.example/api/webhook"
    dependencies:
      softwareTemplates:
        host: github.com
        organization: contract-first-idp-test
        repository: software-templates
        repositoryUrl: https://github.com/contract-first-idp-test/software-templates.git
        revision: v1.1.1
        version: 1.1.1
        catalogPath: catalog-info.yaml
      developerCharts:
        repositoryUrl: https://github.com/contract-first-idp-test/developer-charts.git
        revision: v1.0.2
        version: 1.0.2
    charts:
      repositoryUrl: https://github.com/contract-first-idp-test/developer-charts.git
      revision: v1.0.2
      version: 1.0.2
    schemaRegistry:
      apiUrl: "https://apicurio.apps.fixture.example/apis/registry/v3"
      uiUrl: "https://apicurio-ui.apps.fixture.example"
    spectralRules:
      repositoryUrl: https://github.com/contract-first-idp/spectral-rules.git
      revision: f2a1e6ab9f428eb822c232d8f460ff1e00199113
      path: ruleset.yaml
    registry:
      quay:
        host: "registry-quay-quay.apps.fixture.example"
        url: "https://registry-quay-quay.apps.fixture.example"
        clusterId: openshift
        credentials:
          sourcePullSecretName: default-quay-openshift
          destinationPushSecretName: builder-quay-openshift
          runtimePullSecretName: default-quay-openshift
    services:
      devSpaces:
        url: "https://devspaces.apps.fixture.example"
        githubCallbackUrl: "https://devspaces.apps.fixture.example/api/oauth/callback"
      developerHub:
        url: "https://backstage-backstage-developer-hub.apps.fixture.example"
        oidcCallbackUrl: "https://backstage-backstage-developer-hub.apps.fixture.example/api/auth/oidc/handler/frame"
      keycloak:
        url: "https://cf-idp-keycloak-keycloak.apps.fixture.example"
        privateUrl: https://cf-idp-keycloak.cf-idp-keycloak.svc:8443
      microcks:
        url: "https://microcks.apps.fixture.example"
        redirectUri: "https://microcks.apps.fixture.example/*"
      hawtio:
        host: "hawtio.apps.fixture.example"
      gitea:
        rootUrl: "https://gitea-gitea.apps.fixture.example/"
        domain: "gitea-gitea.apps.fixture.example"
        sshDomain: "gitea-ssh.apps.fixture.example"
    build:
      sourceRevision: main
      sccClusterRoleName: system:openshift:scc:pipelines-scc
      deploymentUpdate:
        strategy: restart
