apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - keycloak.yaml
  - quay.yaml
  - quay-bridge.yaml
  - apicurio.yaml
  - apicurito.yaml
  - microcks.yaml
  - hawtio.yaml
  - pipelines.yaml
  - devspaces.yaml
  - developer-hub.yaml
  - tenant-admissions.yaml
  - gitea.yaml
configMapGenerator:
  - name: platform-settings
    envs: [../../config/platform.env]
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source: {kind: ConfigMap, name: platform-settings, fieldPath: data.PLATFORM_REPO_URL}
    targets:
      - select: {kind: Application}
        reject: [{name: microcks}]
        fieldPaths: [spec.source.repoURL]
      - select: {kind: Application, name: microcks}
        fieldPaths: [spec.sources.1.repoURL]
  - source: {kind: ConfigMap, name: platform-settings, fieldPath: data.PLATFORM_CONFIG_REVISION}
    targets:
      - select: {kind: Application}
        reject: [{name: microcks}]
        fieldPaths: [spec.source.targetRevision]
      - select: {kind: Application, name: microcks}
        fieldPaths: [spec.sources.1.targetRevision]
