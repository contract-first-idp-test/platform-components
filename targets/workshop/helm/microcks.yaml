# Workshop endpoint overrides for the official Microcks chart.
microcks:
  url: microcks.apps.example.cluster.com
  ingressClassName: openshift-default
  ingressAnnotations:
    route.openshift.io/termination: edge
  grpcEnableTLS: false
  grpcIngressClassName: openshift-default
  grpcIngressAnnotations:
    route.openshift.io/termination: edge

keycloak:
  url: cf-idp-keycloak-keycloak.apps.example.cluster.com
  privateUrl: https://cf-idp-keycloak.keycloak.svc:8443
  realm: cf-idp
