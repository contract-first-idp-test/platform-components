apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: platform-realm
  namespace: cf-idp-keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  keycloakCRName: cf-idp-keycloak
  placeholders:
    DEMO_USER_USERNAME:
      secret:
        name: keycloak-realm-secrets
        key: demo-user-username
    DEMO_USER_PASSWORD:
      secret:
        name: keycloak-realm-secrets
        key: demo-user-password
    BACKSTAGE_CLIENT_SECRET:
      secret:
        name: keycloak-realm-secrets
        key: backstage-client-secret
    DEVELOPER_HUB_URL:
      secret:
        name: keycloak-realm-secrets
        key: developer-hub-url
    DEVELOPER_HUB_OIDC_CALLBACK:
      secret:
        name: keycloak-realm-secrets
        key: developer-hub-oidc-callback
    MICROCKS_REDIRECT_URI:
      secret:
        name: keycloak-realm-secrets
        key: microcks-redirect-uri
    MICROCKS_URL:
      secret:
        name: keycloak-realm-secrets
        key: microcks-url
    APICURIO_UI_URL:
      secret:
        name: keycloak-realm-secrets
        key: apicurio-ui-url
  realm:
    id: platform
    realm: platform
    displayName: Platform
    enabled: true
    sslRequired: external
    registrationAllowed: false
    loginWithEmailAllowed: true
    defaultRoles: []
    roles:
      realm:
        - name: sr-admin
          composite: false
        - name: sr-developer
          composite: false
        - name: sr-readonly
          composite: false
        - name: microcks-publisher
          composite: true
          composites:
            client:
              microcks-app: [manager, user]
      client:
        microcks-app:
        - name: user
          composite: false
          clientRole: true
        - name: manager
          composite: false
          clientRole: true
        - name: admin
          composite: false
          clientRole: true
    groups:
    - name: platform-maintainers
      realmRoles: [sr-admin]
    - name: domain-maintainers
      realmRoles: [sr-developer]
    - name: domain-contributors
    - name: domain-viewers
    - name: microcks
      path: /microcks
      attributes: {}
      realmRoles: []
      clientRoles: {}
      subGroups:
      - name: manager
        path: /microcks/manager
        attributes: {}
        realmRoles: []
        clientRoles: {}
        subGroups: []
    users:
    - username: ${DEMO_USER_USERNAME}
      enabled: true
      emailVerified: true
      firstName: Platform
      lastName: User
      email: demo-user@example.com
      groups:
      - /platform-maintainers
      - /domain-maintainers
      - /microcks/manager
      credentials:
      - type: password
        value: ${DEMO_USER_PASSWORD}
        temporary: false
    - username: service-account-backstage
      enabled: true
      serviceAccountClientId: backstage
      clientRoles:
        realm-management:
        - view-users
        - query-groups
        - query-users
    # The Client Admin API creates clients with fullScopeAllowed=false. Permit only these
    # platform roles through the built-in roles scope; a client still receives nothing
    # unless its service account is explicitly assigned the role.
    scopeMappings:
      - clientScope: roles
        roles: [sr-admin, sr-developer, sr-readonly, microcks-publisher]
    clientScopeMappings:
      microcks-app:
      - client: microcks-app-js
        roles:
        - manager
        - admin
        - user
      realm-management:
      - client: microcks-app-js
        roles:
        - manage-users
        - manage-clients
    clients:
    - clientId: registry-api
      enabled: true
      bearerOnly: true
      publicClient: false
    - clientId: apicurio-registry
      enabled: true
      publicClient: true
      standardFlowEnabled: true
      redirectUris:
      - ${APICURIO_UI_URL}/*
      webOrigins:
      - ${APICURIO_UI_URL}
    - clientId: backstage
      enabled: true
      clientAuthenticatorType: client-secret
      secret: ${BACKSTAGE_CLIENT_SECRET}
      redirectUris:
      - ${DEVELOPER_HUB_OIDC_CALLBACK}
      webOrigins:
      - ${DEVELOPER_HUB_URL}
      standardFlowEnabled: true
      directAccessGrantsEnabled: true
      serviceAccountsEnabled: true
      publicClient: false
      defaultClientScopes:
      - profile
      - roles
      - email
    - clientId: microcks-app
      enabled: true
      bearerOnly: true
      defaultRoles:
      - user
    - clientId: microcks-app-js
      enabled: true
      publicClient: true
      standardFlowEnabled: true
      webOrigins:
      - ${MICROCKS_URL}
      redirectUris:
      - ${MICROCKS_REDIRECT_URI}
      fullScopeAllowed: false
      protocolMappers:
      - name: microcks-group-mapper
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        consentRequired: false
        config:
          full.path: 'true'
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: microcks-groups
          userinfo.token.claim: 'true'
    requiredActions:
    - alias: VERIFY_PROFILE
      name: Verify Profile
      providerId: VERIFY_PROFILE
      enabled: false
      defaultAction: false
      priority: 90
      config: {}
