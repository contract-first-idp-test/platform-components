apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm-secrets
  namespace: cf-idp-keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  target:
    name: keycloak-realm-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        backstage-client-secret: '{{ .backstageClientSecret }}'
        demo-user-username: '{{ .demoUserUsername }}'
        demo-user-password: '{{ .demoUserPassword }}'
        developer-hub-url: '{{ $target := .platformConfig | fromYaml }}{{ $target.spec.platform.services.developerHub.url }}'
        developer-hub-oidc-callback: '{{ $target := .platformConfig | fromYaml }}{{ $target.spec.platform.services.developerHub.oidcCallbackUrl }}'
        microcks-url: '{{ $target := .platformConfig | fromYaml }}{{ $target.spec.platform.services.microcks.url }}'
        microcks-redirect-uri: '{{ $target := .platformConfig | fromYaml }}{{ $target.spec.platform.services.microcks.redirectUri }}'
        apicurio-ui-url: '{{ $target := .platformConfig | fromYaml }}{{ $target.spec.platform.schemaRegistry.uiUrl }}'
  data:
    - secretKey: platformConfig
      sourceRef: {storeRef: {kind: ClusterSecretStore, name: cf-idp-config}}
      remoteRef: {key: platform-target-config, property: platform.yaml}
    - secretKey: backstageClientSecret
      sourceRef: {storeRef: {kind: ClusterSecretStore, name: cf-idp-secrets}}
      remoteRef: {key: platform-generated-secrets, property: KEYCLOAK_BACKSTAGE_CLIENT_SECRET}
    - secretKey: demoUserUsername
      sourceRef: {storeRef: {kind: ClusterSecretStore, name: cf-idp-secrets}}
      remoteRef: {key: platform-secrets, property: DEMO_USER_USERNAME}
    - secretKey: demoUserPassword
      sourceRef: {storeRef: {kind: ClusterSecretStore, name: cf-idp-secrets}}
      remoteRef: {key: platform-generated-secrets, property: DEMO_USER_PASSWORD}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-idp-keycloak-admin
  namespace: cf-idp-keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  refreshPolicy: CreatedOnce
  target:
    name: cf-idp-keycloak-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client-id: cf-idp-keycloak-admin
        client-secret: '{{ .clientSecret }}'
  data:
    - secretKey: clientSecret
      sourceRef: {storeRef: {kind: ClusterSecretStore, name: cf-idp-secrets}}
      remoteRef: {key: platform-generated-secrets, property: KEYCLOAK_CLIENT_ADMIN_SECRET}
