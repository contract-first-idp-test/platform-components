apiVersion: registry.apicur.io/v1
kind: ApicurioRegistry3
metadata:
  name: apicurio-registry
  namespace: apicurio
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    platform.contract-first.io/router-domain: example.invalid
    platform.contract-first.io/keycloak-host: cf-idp-keycloak-keycloak.invalid
spec:
  app:
    auth:
      enabled: true
      authServerUrl: https://cf-idp-keycloak-keycloak.invalid/realms/platform
      tls:
        tlsVerificationType: REQUIRED
      appClientId: registry-api
      uiClientId: apicurio-registry
      redirectUri: https://apicurio-ui.invalid
      logoutUrl: https://apicurio-ui.invalid
      anonymousReadsEnabled: true
      authz:
        enabled: true
        ownerOnlyEnabled: true
        groupAccessEnabled: true
        readAccessEnabled: true
        roles:
          source: token
          admin: sr-admin
          developer: sr-developer
          readOnly: sr-readonly
    storage:
      type: postgresql
      sql:
        dataSource:
          url: jdbc:postgresql://apicurio-db-primary:5432/apicurio
          username: apicurio
          password:
            name: apicurio-db-pguser-apicurio
            key: password
    ingress:
      enabled: true
      host: apicurio.invalid
      ingressClassName: openshift-default
      annotations:
        route.openshift.io/termination: edge
  ui:
    env:
      - name: REGISTRY_API_URL
        value: https://replace.invalid/apis/registry/v3
    ingress:
      enabled: true
      host: apicurio-ui.invalid
      ingressClassName: openshift-default
      annotations:
        route.openshift.io/termination: edge
