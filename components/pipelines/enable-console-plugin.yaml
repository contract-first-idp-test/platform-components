apiVersion: v1
kind: ServiceAccount
metadata:
  name: enable-pipelines-console-plugin
  namespace: tekton-tasks
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: enable-pipelines-console-plugin
  annotations:
    argocd.argoproj.io/sync-wave: "10"
rules:
  - apiGroups: [operator.openshift.io]
    resources: [consoles]
    resourceNames: [cluster]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enable-pipelines-console-plugin
  annotations:
    argocd.argoproj.io/sync-wave: "10"
subjects:
  - kind: ServiceAccount
    name: enable-pipelines-console-plugin
    namespace: tekton-tasks
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: enable-pipelines-console-plugin
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enable-pipelines-console-plugin
  namespace: tekton-tasks
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enable-pipelines-console-plugin
    spec:
      serviceAccountName: enable-pipelines-console-plugin
      restartPolicy: OnFailure
      containers:
        - name: patch-console
          image: registry.redhat.io/openshift4/ose-cli
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              plugin=pipelines-console-plugin
              current="$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins[*]}')"
              case " $current " in
                *" $plugin "*) exit 0 ;;
              esac
              if [ -z "$current" ]; then
                patch='[{"op":"add","path":"/spec/plugins","value":["pipelines-console-plugin"]}]'
              else
                patch='[{"op":"add","path":"/spec/plugins/-","value":"pipelines-console-plugin"}]'
              fi
              oc patch console.operator.openshift.io cluster --type=json -p="$patch"
