apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: microcks-cli
  namespace: tekton-tasks
  labels:
    app.kubernetes.io/version: latest-2025-11-28
spec:
  description: Run a platform-pinned Microcks CLI command supplied by a Pipeline.
  params:
    - name: SCRIPT
      type: string
      description: Microcks CLI workflow script.
  workspaces:
    - name: source
  steps:
    - name: microcks-cli
      image: quay.io/microcks/microcks-cli@sha256:7c0ea4c73f68e17614512499d5d707b52fa6d2539375778efa760c10cf25aa2e
      workingDir: $(workspaces.source.path)
      command: [/usr/bin/bash, -ec]
      args: ["$(params.SCRIPT)"]
