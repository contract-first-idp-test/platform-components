apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: docker.io/gitea/gitea:1.26-rootless
          env:
            - name: GITEA__server__ROOT_URL
              valueFrom: {secretKeyRef: {name: gitea-config, key: ROOT_URL}}
            - name: GITEA__server__DOMAIN
              valueFrom: {secretKeyRef: {name: gitea-config, key: DOMAIN}}
            - name: GITEA__server__SSH_DOMAIN
              valueFrom: {secretKeyRef: {name: gitea-config, key: SSH_DOMAIN}}
            - name: GITEA__server__START_SSH_SERVER
              value: "true"
            - name: GITEA__server__SSH_PORT
              value: "22"
            - name: GITEA__server__SSH_LISTEN_PORT
              value: "2222"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__packages__ENABLED
              value: "true"
            - name: GITEA__packages.npm__ENABLED
              value: "true"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__security__REVERSE_PROXY_LIMIT
              value: "1"
            - name: GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES
              value: "*"
            - name: GITEA__database__DB_TYPE
              value: postgres
            - name: GITEA__database__SSL_MODE
              value: require
            - name: GITEA__database__HOST
              valueFrom:
                secretKeyRef:
                  name: gitea-db-pguser-postgres
                  key: host
            - name: GITEA__database__NAME
              valueFrom:
                secretKeyRef:
                  name: gitea-db-pguser-postgres
                  key: dbname
            - name: GITEA__database__USER
              valueFrom:
                secretKeyRef:
                  name: gitea-db-pguser-postgres
                  key: user
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-db-pguser-postgres
                  key: password
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: SECRET_KEY
            - name: GITEA__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: INTERNAL_TOKEN
            - name: GITEA__oauth2__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: JWT_SECRET
            - name: HOME
              value: /data/gitea
            - name: GITEA_CUSTOM
              value: /data/gitea/custom
            - name: GITEA_APP_INI
              value: /data/gitea/conf/app.ini
            - name: GITEA_TEMP
              value: /data/gitea/temp
            - name: GITEA_WORK_DIR
              value: /data/gitea
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: ssh
      port: 22
      targetPort: ssh
