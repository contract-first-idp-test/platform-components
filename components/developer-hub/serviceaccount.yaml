apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-cluster-viewer
  namespace: developer-hub
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-cluster-viewer-token
  namespace: developer-hub
  annotations:
    kubernetes.io/service-account.name: backstage-cluster-viewer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-cluster-viewer-binding
subjects:
  - {kind: ServiceAccount, name: backstage-cluster-viewer, namespace: developer-hub}
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
