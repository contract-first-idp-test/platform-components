apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: backstage
  namespace: developer-hub
spec:
  application:
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    appConfig:
      mountPath: /opt/app-root/src
      configMaps: [{name: app-config-rhdh}]
    extraEnvs:
      envs:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
      secrets:
        - {name: rhdh-secrets}
        - {name: backstage-cluster-viewer-token, key: token}
    extraFiles:
      configMaps:
        - name: cf-idp-compatibility-action
          mountPath: /opt/app-root/src/local-plugins/contract-first-idp-compatibility
          containers:
            - backstage-backend
            - install-dynamic-plugins
    route: {enabled: true}
  database: {enableLocalDb: true}
