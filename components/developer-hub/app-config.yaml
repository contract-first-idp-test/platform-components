apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: developer-hub
data:
  app-config-rhdh.yaml: |
    app:
      title: Contract-First IDP
      baseUrl: ${DEVELOPER_HUB_URL}
    backend:
      reading:
        allow:
          - host: ${SCHEMA_REGISTRY_HOST}
            paths:
              - /apis/registry/v3/
      auth:
        keys:
          - secret: ${BACKEND_SECRET}
      baseUrl: ${DEVELOPER_HUB_URL}
      cors:
        origin: ${DEVELOPER_HUB_URL}
    signInPage: oidc
    auth:
      session:
        secret: ${BACKEND_SECRET}
      environment: production
      providers:
        oidc:
          production:
            clientId: backstage
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            metadataUrl: ${KEYCLOAK_BASE_URL}/realms/cf-idp/.well-known/openid-configuration
            prompt: auto
    integrations:
      github:
        - host: ${GITHUB_HOST}
          token: ${GITHUB_TOKEN}
    kubernetes:
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: ${K8S_CLUSTER_NAME}
              url: ${K8S_CLUSTER_URL}
              authProvider: serviceAccount
              serviceAccountToken: ${token}
              skipTLSVerify: true
      customResources:
        - {group: tekton.dev, apiVersion: v1, plural: pipelines}
        - {group: tekton.dev, apiVersion: v1, plural: pipelineruns}
        - {group: tekton.dev, apiVersion: v1, plural: taskruns}
        - {group: triggers.tekton.dev, apiVersion: v1beta1, plural: eventlisteners}
        - {group: triggers.tekton.dev, apiVersion: v1beta1, plural: triggertemplates}
        - {group: triggers.tekton.dev, apiVersion: v1beta1, plural: triggerbindings}
        - {group: route.openshift.io, apiVersion: v1, plural: routes}
        - {group: argoproj.io, apiVersion: v1alpha1, plural: applications}
        - {group: argoproj.io, apiVersion: v1alpha1, plural: applicationsets}
        - {group: postgres-operator.crunchydata.com, apiVersion: v1beta1, plural: postgresclusters}
      serviceLocatorMethod: {type: multiTenant}
    catalog:
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      locations:
        - type: url
          target: ${SOFTWARE_TEMPLATES_CATALOG_URL}
      rules:
        - allow: [Component, System, Group, Resource, Location, Template, API, Domain]
      providers:
        github:
          organization:
            organization: ${GITHUB_ORG}
            catalogPath: /catalog-info.yaml
            filters: {branch: main, repository: '${GITHUB_CATALOG_REPOSITORY_FILTER}'}
            schedule:
              frequency: {minutes: 5}
              timeout: {minutes: 3}
              initialDelay: {seconds: 15}
        keycloakOrg:
          production:
            baseUrl: ${KEYCLOAK_BASE_URL}
            loginRealm: cf-idp
            realm: cf-idp
            clientId: backstage
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            filters: {kind: [Group, User]}
            schedule:
              frequency: {minutes: 1}
              timeout: {minutes: 1}
              initialDelay: {seconds: 15}
