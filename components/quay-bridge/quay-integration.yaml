apiVersion: quay.redhat.com/v1
kind: QuayIntegration
metadata:
  name: quay
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  clusterID: openshift
  credentialsSecret:
    name: quay-access-token
    namespace: openshift-operators
  insecureRegistry: false
  # Required CRD scalar; the ApplicationSet replaces this sentinel inline.
  quayHostname: https://replace-by-target.invalid
