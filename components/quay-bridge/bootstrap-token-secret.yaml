apiVersion: v1
kind: ServiceAccount
metadata:
  name: quay-bootstrap-token-reader
  namespace: openshift-operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quay-bootstrap-token-reader
  namespace: quay
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [registry-bootstrap-token]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-bootstrap-token-reader
  namespace: quay
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quay-bootstrap-token-reader
subjects:
  - kind: ServiceAccount
    name: quay-bootstrap-token-reader
    namespace: openshift-operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: quay-bootstrap-token-reader-review
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quay-bootstrap-token-reader-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: quay-bootstrap-token-reader-review
subjects:
  - kind: ServiceAccount
    name: quay-bootstrap-token-reader
    namespace: openshift-operators
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: quay-bootstrap-token
  namespace: openshift-operators
spec:
  provider:
    kubernetes:
      remoteNamespace: quay
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: openshift-operators
          key: ca.crt
      auth:
        serviceAccount:
          name: quay-bootstrap-token-reader
          namespace: openshift-operators
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quay-access-token
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: quay-bootstrap-token
  target:
    name: quay-access-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: '{{ (.bootstrapToken | fromJson).access_token }}'
  data:
    - secretKey: bootstrapToken
      remoteRef:
        key: registry-bootstrap-token
        property: token.json
