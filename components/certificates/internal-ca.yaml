apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: internal-ca-bootstrap
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  secretName: internal-ca
  duration: 87600h
  renewBefore: 8760h
  commonName: Contract-First IDP Demo CA
  isCA: true
  issuerRef:
    name: internal-ca-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cf-idp-internal
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  ca:
    secretName: internal-ca
