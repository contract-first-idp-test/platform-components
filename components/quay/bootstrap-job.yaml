apiVersion: batch/v1
kind: Job
metadata:
  name: quay-bootstrap
  namespace: quay
  annotations:
    argocd.argoproj.io/sync-wave: '5'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 8
  template:
    spec:
      serviceAccountName: quay-bootstrap
      restartPolicy: OnFailure
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: initialize
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.21
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          env:
            - {name: QUAY_USERNAME, valueFrom: {secretKeyRef: {name: quay-bootstrap, key: username}}}
            - {name: QUAY_PASSWORD, valueFrom: {secretKeyRef: {name: quay-bootstrap, key: password}}}
            - {name: QUAY_EMAIL, valueFrom: {secretKeyRef: {name: quay-bootstrap, key: email}}}
            - {name: QUAY_HOST, valueFrom: {secretKeyRef: {name: quay-bootstrap, key: host}}}
          command: [/bin/bash, -ec]
          args:
            - |
              if oc get secret quay-access-token -n openshift-operators >/dev/null 2>&1; then
                exit 0
              fi
              until curl -ksf "https://${QUAY_HOST}/health/instance" >/dev/null; do sleep 10; done
              response=$(curl -ksS -X POST "https://${QUAY_HOST}/api/v1/user/initialize" \
                -H 'content-type: application/json' \
                --data "{\"username\":\"${QUAY_USERNAME}\",\"password\":\"${QUAY_PASSWORD}\",\"email\":\"${QUAY_EMAIL}\",\"access_token\":true}")
              token=$(printf '%s' "$response" | sed -nE 's/.*"access_token"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p')
              test -n "$token"
              oc create secret generic quay-access-token -n openshift-operators \
                --from-literal=token="$token" --from-literal=access_token="$token" --dry-run=client -o yaml | oc apply -f -
