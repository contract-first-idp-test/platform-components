apiVersion: batch/v1
kind: Job
metadata:
  name: quay-activate
  namespace: quay
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quay-activate
    spec:
      serviceAccountName: quay-activate
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: activate
          image: quay.io/openshift/origin-cli:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          command: [oc]
          args:
            - rollout
            - restart
            - deployment/registry-quay-app
            - -n
            - quay
