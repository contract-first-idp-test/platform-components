apiVersion: v1
kind: ServiceAccount
metadata:
  name: quay-bootstrap
  namespace: quay
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quay-token-writer
  namespace: openshift-operators
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-token-writer
  namespace: openshift-operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quay-token-writer
subjects:
  - kind: ServiceAccount
    name: quay-bootstrap
    namespace: quay
