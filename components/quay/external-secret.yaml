apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quay-config
  namespace: quay
spec:
  target:
    name: quay-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          {{- $target := .platformConfig | fromYaml }}
          SETUP_COMPLETE: true
          FEATURE_UI_V2: true
          REGISTRY_TITLE: Contract-First IDP Container Registry
          SERVER_HOSTNAME: {{ $target.spec.platform.registry.quay.host }}
          PREFERRED_URL_SCHEME: https
          AUTHENTICATION_TYPE: Database
          FEATURE_USER_INITIALIZE: true
          SUPER_USERS:
            - {{ .username }}
          FEATURE_USER_CREATION: false
          FEATURE_AUTO_CREATE_ORG: false
          FEATURE_USERNAME_CONFIRMATION: true
          FEATURE_MAILING: false
          ALLOW_PULLS_WITHOUT_STRICT_LOGGING: true
          FEATURE_APP_REGISTRY: true

          # Quay creates the bootstrap OAuth application/token after the owner exists.
          # The Quay Operator creates registry-bootstrap-token and its supporting RBAC.
          # The Quay application publishes the token to registry-bootstrap-token/token.json.
          FEATURE_PROGRAMMATIC_BOOTSTRAP: true
          BOOTSTRAP_TOKEN_OWNER: {{ .username }}
          BOOTSTRAP_TOKEN_EXPIRATION: 315576000
          BOOTSTRAP_TOKEN_SCOPE: "org:admin repo:admin repo:create repo:read repo:write super:user user:admin user:read"
  data:
    - secretKey: platformConfig
      sourceRef: {storeRef: {kind: ClusterSecretStore, name: cf-idp-config}}
      remoteRef: {key: platform-target-config, property: platform.yaml}
    - secretKey: username
      sourceRef: {storeRef: {kind: ClusterSecretStore, name: cf-idp-secrets}}
      remoteRef: {key: platform-secrets, property: QUAY_ADMIN_USERNAME}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quay-bootstrap
  namespace: quay
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  target:
    name: quay-bootstrap
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
        email: '{{ .email }}'
        host: >-
          {{- $target := .platformConfig | fromYaml }}
          {{ $target.spec.platform.registry.quay.host }}
  data:
    - secretKey: platformConfig
      sourceRef: {storeRef: {kind: ClusterSecretStore, name: cf-idp-config}}
      remoteRef: {key: platform-target-config, property: platform.yaml}
    - secretKey: username
      sourceRef: {storeRef: {kind: ClusterSecretStore, name: cf-idp-secrets}}
      remoteRef: {key: platform-secrets, property: QUAY_ADMIN_USERNAME}
    - secretKey: password
      sourceRef: {storeRef: {kind: ClusterSecretStore, name: cf-idp-secrets}}
      remoteRef: {key: platform-secrets, property: QUAY_ADMIN_PASSWORD}
    - secretKey: email
      sourceRef: {storeRef: {kind: ClusterSecretStore, name: cf-idp-secrets}}
      remoteRef: {key: platform-secrets, property: QUAY_ADMIN_EMAIL}
